server:
  port: 8083

spring:
  main:
    banner-mode: off

agentscope:
  agent:
    enabled: true
  model:
    provider: anthropic
  anthropic:
    api-key: ${ANTHROPIC_AUTH_TOKEN}
    base-url: ${ANTHROPIC_BASE_URL}
    model-name: ${ANTHROPIC_MODEL}
    stream: true
  agui:
    path-prefix: /agui
    cors-enabled: true
    cors-allowed-origins:
      - "*"
    run-timeout: 10m
    emit-state-events: true
    emit-tool-call-args: true
    default-agent-id: bank-risk
    agent-id-header: X-Agent-Id
    enable-path-routing: true
    server-side-memory: true
    max-thread-sessions: 1000
    session-timeout-minutes: 60
    enable-reasoning: false
  skill:
    auto-load: false
    expose-all-metadata: false

logging:
  level:
    root: INFO
    io.agentscope: DEBUG
    io.agentscope.examples.bankrisk: DEBUG
